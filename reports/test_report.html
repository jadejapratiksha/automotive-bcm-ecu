
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Automotive BCM Test Report</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        .report {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            border: 1px solid #dddddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #eeeeee;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="report">
        <h1>Automotive BCM ECU</h1>
        <h2>Ceedling Unit Test Report</h2>

        <table>
            <tr>
                <th>Metric</th>
                <th>Result</th>
            </tr>

            <tr>
                <td>Total Tests</td>
                <td>153</td>
            </tr>

            <tr>
                <td>Passed Tests</td>
                <td>153</td>
            </tr>

            <tr>
                <td>Failed Tests</td>
                <td>0</td>
            </tr>

            <tr>
                <td>Ignored Tests</td>
                <td>0</td>
            </tr>

            <tr>
                <td>Status</td>
                <td class="pass">
                    PASS
                </td>
            </tr>

            <tr>
                <td>Generated</td>
                <td>2026-07-30 14:41:34</td>
            </tr>
        </table>
    </div>
</body>
</html>
